name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # setiap hari jam 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: Abong-123
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/pacman-contribution-graph.svg
          game: pacman
          game_theme: github-dark

      - name: Push SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
